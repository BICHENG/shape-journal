<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>服装量体 · 三维工作台</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #191b24;
      --quiet: #5d626f;
      --edge: #e2e3ea;
      --paper: #f7f7f9;
      --surface: #fff;
      --accent: #243bc6;
      --signal: #334adb;
      --selected: #eff1fd;
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; color: var(--ink); background: var(--surface);
      font: 14px/1.45 "Segoe UI Variable Text", "Microsoft YaHei UI", sans-serif;
    }
    h1, h2, h3, p { margin: 0; }
    button, input { font: inherit; }
    button, .downloadItem a {
      min-height: 36px; padding: 6px 10px;
      border: 1px solid var(--edge); border-radius: 5px;
      color: var(--ink); background: var(--surface);
      font-weight: 650; cursor: pointer;
    }
    button:hover:not(:disabled), .downloadItem a:hover { background: var(--selected); }
    button:focus-visible, summary:focus-visible, a:focus-visible, input:focus-visible {
      outline: 2px solid var(--signal); outline-offset: 2px;
    }
    button:disabled { opacity: .54; cursor: default; }
    .primary { background: var(--accent); border-color: var(--accent); color: white; }
    .primary:hover:not(:disabled) { background: #192ba0; }

    .shell { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100dvh; min-height: 540px; }
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px 20px; padding: 16px clamp(16px, 2.8vw, 40px);
      border-bottom: 1px solid var(--edge); background: var(--surface);
    }
    .identityHead { min-width: 0; }
    .documentTitle { display: flex; align-items: baseline; gap: 13px; min-width: 0; }
    .wordmark {
      flex: none; color: #454958; border-right: 1px solid var(--edge); padding-inline-end: 13px;
      font-size: 11px; font-weight: 800; letter-spacing: .16em;
    }
    h1 { font-size: 24px; font-weight: 650; line-height: 1.2; letter-spacing: -.02em; overflow-wrap: anywhere; }
    h2 { font-size: 16px; }
    .identityMeta {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px 11px; margin-top: 5px;
      color: var(--quiet); font-size: 12px;
    }
    .identityMeta b { color: var(--ink); font-variant-numeric: tabular-nums; }
    .heightTrigger { min-height: 28px; padding: 4px 0; border: 0; font-weight: 500; }
    .heightAction { margin-inline-start: 6px; color: var(--signal); font-weight: 600; }
    .toolbarActions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .toolbarActions button { padding-inline: 13px; white-space: nowrap; }
    #uploadHome { padding: 6px 3px; color: var(--quiet); text-underline-offset: 3px; white-space: nowrap; }

    .workspace {
      display: grid; min-width: 0; min-height: 0;
      grid-template-columns: minmax(0, 1fr) clamp(340px, 28vw, 405px);
    }
    .stage {
      position: relative; min-width: 0; min-height: 310px;
      overflow: hidden; isolation: isolate;
      background: radial-gradient(ellipse at 46% 29%, #f7f7fa 8%, #eeeef3 58%, #dfe1e9 100%);
    }
    .stage::before {
      position: absolute; inset: 0; content: ""; pointer-events: none;
      background: radial-gradient(ellipse 22% 2.5% at 52% 87%, #a0a0b533, transparent 88%);
    }
    #viewer3d, #viewer3d canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #viewer3d canvas { touch-action: none; }
    .stageIdentity {
      position: absolute; top: 26px; left: clamp(16px, 2.8vw, 40px);
      display: grid; gap: 4px; font-size: 16px; font-weight: 650; pointer-events: none;
    }
    #subjectPose { color: var(--quiet); font-size: 12px; font-weight: 450; }
    .stageHelp {
      position: absolute; left: clamp(16px, 2.8vw, 40px); bottom: 28px;
      color: var(--quiet); font-size: 12px; pointer-events: none;
    }
    .touchHelp { display: none; }
    .viewControls {
      display: flex; position: absolute; bottom: 18px; right: clamp(16px, 2vw, 30px); gap: 1px;
      padding: 3px; border: 1px solid white; border-radius: 10px; background: #ffffffbf;
      backdrop-filter: blur(10px); box-shadow: 0 5px 20px #555d7d14; white-space: nowrap;
    }
    .viewControls button { min-height: 34px; padding: 4px 12px; border: 0; color: #404557; background: transparent; }
    .viewControls button:hover:not(:disabled) { background: var(--selected); }
    .tapeHud {
      display: none; position: absolute; max-width: calc(100% - 25px);
      padding: 4px 9px; transform: translate(8px, -110%);
      border: 1px solid #c5cdfd; border-radius: 12px; background: #fbfbff; color: #253bbb;
      font-size: 12px; font-weight: 600; pointer-events: none;
    }

    .inspector {
      min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: auto;
      border-left: 1px solid var(--edge); background: var(--surface);
    }
    .inspection {
      flex: 0 0 auto; display: grid; gap: 12px; padding: 23px 25px 20px;
      border-bottom: 1px solid var(--edge);
    }
    .focusedReading {
      display: flex; align-items: end; justify-content: space-between; flex-wrap: wrap; gap: 6px 12px;
    }
    #inspectionHeading { font-size: 23px; font-weight: 650; line-height: 1.2; letter-spacing: -.015em; }
    #inspectionMode { color: var(--signal); font-size: 12px; font-weight: 650; margin-bottom: 7px; }
    #inspectionValue {
      color: var(--ink); font-size: 44px; line-height: 1;
      font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.055em;
    }
    #inspectionValue:empty, #inspectionMode:empty, #tapeStatus:empty, #poseStatus:empty,
    #workProgressStatus:empty, #autosaveStatus:empty { display: none; }
    #tapeStatus, #poseStatus, #workProgressStatus { color: var(--quiet); font-size: 13px; overflow-wrap: anywhere; }
    .inspectionActions, .tapeActions { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .tapeActions:not(:has(button:not([hidden]))) { display: none; }
    #nextMeasurementButton { margin-inline-start: auto; }
    #remeasureButton, #nextMeasurementButton { border-color: transparent; color: #4c536d; font-weight: 550; }
    .projects { flex: 0 0 auto; min-height: 0; overflow: auto; scroll-padding-top: 45px; }
    .projects[open] { flex: 1 1 auto; }
    .projectsHeader {
      display: flex; align-items: center; gap: 8px; min-height: 45px; padding: 13px 25px 9px;
      position: sticky; top: 0; z-index: 1; background: var(--surface);
      color: var(--ink); font-size: 14px; font-weight: 650;
    }
    .projects[open] > summary { margin: 0; }
    .projectsHeader::before {
      content: ""; width: 6px; height: 6px;
      border-bottom: 1.5px solid currentColor; border-right: 1.5px solid currentColor; transform: rotate(-45deg);
    }
    .projects[open] > summary::before { transform: rotate(45deg); }
    #measurementCoverage { margin-inline-start: auto; color: var(--quiet); font-size: 11px; font-weight: 500; white-space: nowrap; }
    #measurementList { padding: 0 16px 10px; }
    .measurementGroup + .measurementGroup { margin-top: 6px; }
    .measurementGroup h3 { margin: 0 5px 3px; color: var(--quiet); font-size: 11px; font-weight: 650; }
    .measurementRow {
      display: flex; width: 100%; min-height: 31px; align-items: center; justify-content: space-between; gap: 4px;
      padding: 4px 8px; border: 1px solid transparent; border-radius: 5px; font-size: 13px; text-align: left;
    }
    .measurementRow[data-active="true"] { background: var(--selected); color: #263ab5; }
    .measurementName { min-width: 0; }
    .measurementName strong { font-weight: 650; }
    .measurementName small { margin-inline-start: 4px; color: var(--quiet); font-size: 10px; white-space: nowrap; }
    .measurementCurrent { display: flex; align-items: baseline; justify-content: flex-end; gap: 7px; min-width: 0; white-space: nowrap; }
    .measurementCurrent b { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .measurementStatus { min-width: 4.05em; text-align: right; color: var(--quiet); font-size: 10px; font-weight: 500; }
    .measurementStatus[data-review="automatic"] { visibility: hidden; }
    .measurementStatus[data-review="confirmed"] { color: #386446; font-weight: 700; }
    .extraTools { flex: 0 0 auto; padding: 14px 25px; border-top: 1px solid var(--edge); }
    summary { color: var(--quiet); font-size: 12px; cursor: pointer; }
    details[open] > summary { margin-bottom: 7px; }
    .reviewBody { padding-top: 4px; }
    #sourceMeasurementList { max-height: min(38vh, 360px); overflow-y: auto; scrollbar-width: thin; }
    dialog {
      width: min(830px, calc(100vw - 26px)); max-height: min(90dvh, 740px); padding: 0;
      border: 1px solid var(--edge); border-radius: 12px; color: var(--ink); background: white;
      box-shadow: 0 18px 55px #14252142; overflow: auto;
    }
    dialog::backdrop { background: #191b2475; }
    #poseControls { width: min(435px, calc(100vw - 26px)); }
    .dialogHead {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px; background: var(--paper); border-bottom: 1px solid var(--edge);
    }
    .dialogContent { display: grid; gap: 14px; padding: 14px 16px 18px; }
    .heightEdit { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    .heightEdit label { grid-column: 1 / -1; }
    .heightEdit input { min-width: 0; min-height: 36px; padding: 6px 9px; border: 1px solid var(--edge); border-radius: 5px; }
    .sliderRow { display: grid; gap: 6px; }
    .sourceStrip { display: grid; gap: 12px; }
    .sourceTile { display: grid; gap: 7px; align-content: start; margin: 0; min-width: 0; }
    .sourceTile img, .sourceTile span {
      width: 100%; height: clamp(140px, 46vh, 360px); object-fit: contain; background: #eef0ea; border-radius: 5px;
    }
    .sourceTile span { display: grid; place-items: center; padding: 8px; color: var(--quiet); }
    .resultTable { border: 1px solid var(--edge); border-radius: 6px; overflow: auto; }
    .calibrationNote { padding: 8px 10px; color: #5d4325; background: #fbf1df; font-size: 12px; }
    .reportRow {
      display: grid; grid-template-columns: minmax(111px, 1.4fr) repeat(var(--value-columns, 1), minmax(89px, 1fr));
      min-width: max-content; align-items: center; gap: 8px; padding: 7px 10px;
      border-bottom: 1px solid var(--edge); font-size: 13px; font-variant-numeric: tabular-nums;
    }
    .reportRow:last-child { border-bottom: 0; }
    .measurementHeader { color: var(--quiet); background: var(--paper); }
    .measurementCell { display: grid; color: var(--ink); }
    .measurementCell small, .measurementCell span { color: var(--quiet); font-size: 11px; }
    .measurementResult[data-status="failed"] strong { color: #963c24; }
    .measurementResult[data-status="passed"] strong { color: var(--accent); }
    .progressActions, .downloads { display: flex; flex-wrap: wrap; gap: 8px; }
    .downloadItem {
      display: flex; align-items: center; justify-content: space-between; gap: 7px;
      padding: 4px; border: 1px solid var(--edge); border-radius: 6px; flex: 1 0 200px;
    }
    .downloadItem strong { padding-inline-start: 5px; }
    .downloadItem a { text-decoration: none; white-space: nowrap; }
    @media (max-width: 700px) {
      .shell { height: auto; min-height: 100dvh; }
      .toolbar { align-items: flex-start; flex-direction: column; padding: 11px 14px 8px; gap: 3px; }
      .toolbarActions { gap: 3px; }
      .toolbarActions button, #uploadHome, .inspection button, .viewControls button { min-height: 44px; }
      .toolbarActions button { padding-inline: 9px; }
      h1 { font-size: 21px; }
      .workspace { display: flex; flex-direction: column; }
      .stage { height: min(49dvh, 435px); min-height: 315px; }
      .stage::before { background: radial-gradient(ellipse 27% 2.5% at 52% 80%, #a0a0b533, transparent 88%); }
      #viewer3d { height: calc(100% - 32px); }
      .stageIdentity { top: 12px; left: 14px; font-size: 14px; }
      #subjectPose { font-size: 10px; }
      .stageHelp { left: 14px; bottom: 17px; font-size: 10px; }
      .viewControls { right: 8px; bottom: 7px; }
      .viewControls button { padding: 4px 9px; }
      .inspector { overflow: visible; border: 0; }
      .inspection { padding: 16px 14px 12px; gap: 9px; }
      #inspectionValue { font-size: 38px; }
      .inspectionActions { gap: 3px; }
      .projects { overflow: visible; }
      .projectsHeader, .extraTools { padding-inline: 14px; }
      .projectsHeader { min-height: 46px; position: static; }
      #measurementList { padding-inline: 8px; }
      .measurementRow { min-height: 44px; }
    }
    @media (pointer: coarse) {
      .desktopHelp { display: none; }
      .touchHelp { display: inline; }
    }
  </style>
</head>
<body data-viewer-runtime="three-bvh">
  <div class="shell">
    <header class="toolbar">
      <div class="identityHead">
        <div class="documentTitle">
          <span class="wordmark">MOXION</span>
          <h1 id="subjectTitle">量体工作台</h1>
        </div>
        <div class="identityMeta">
          <button class="heightTrigger" type="button" data-open-dialog="poseControls">
            <span id="subjectHeightLabel">身高</span> <b id="subjectHeight">--</b><span class="heightAction">修改</span>
          </button>
          <span id="autosaveStatus" role="status"></span>
          <span id="subjectSource" hidden></span>
        </div>
      </div>
      <div class="toolbarActions">
        <a id="uploadHome" href="/" hidden>工作台首页</a>
        <button type="button" data-open-dialog="referenceDialog">原片与姿态</button>
        <button id="openResultsButton" type="button" data-open-dialog="resultsDialog">尺寸与导出</button>
      </div>
    </header>

    <main class="workspace">
      <section class="stage" aria-label="三维人台">
        <div id="viewer3d"></div>
        <div class="stageIdentity"><span>人台</span><span id="subjectPose">--</span></div>
        <p class="stageHelp"><span class="desktopHelp">拖动旋转 · 滚轮缩放</span><span class="touchHelp">拖动旋转 · 双指缩放</span></p>
        <div id="tapeHud" class="tapeHud"></div>
        <nav class="viewControls" aria-label="人台视角">
          <button type="button" data-body-view="front">正面</button>
          <button type="button" data-body-view="side">侧面</button>
          <button type="button" data-body-view="back">背面</button>
          <button type="button" data-body-view="fit">复位</button>
        </nav>
      </section>

      <aside class="inspector" aria-label="尺线检查">
        <section class="inspection" aria-labelledby="inspectionHeading">
          <div class="focusedReading">
            <div>
              <p id="inspectionMode"></p>
              <h2 id="inspectionHeading">检查尺线</h2>
            </div>
            <output id="inspectionValue" aria-label="当前尺线尺寸"></output>
          </div>
          <p id="tapeStatus" aria-live="polite"></p>
          <div class="inspectionActions">
            <div class="tapeActions">
              <button class="primary" id="saveTapeButton" type="button" hidden>确认尺线</button>
              <button id="remeasureButton" type="button" hidden>重新落尺</button>
              <button id="cancelTapeButton" type="button" hidden>取消</button>
            </div>
            <button id="nextMeasurementButton" type="button">开始检查</button>
          </div>
        </section>

        <details class="projects" id="measurementProjects" open>
          <summary class="projectsHeader"><span id="measurementListTitle">全部尺寸</span><span id="measurementCoverage"></span></summary>
          <div id="measurementList"></div>
        </details>

        <details class="extraTools" id="sourceReview" hidden>
          <summary>来源复查</summary>
          <div class="reviewBody" id="sourceMeasurementList"></div>
        </details>
      </aside>
    </main>
  </div>

  <dialog id="poseControls" aria-labelledby="poseDialogTitle">
    <div class="dialogHead">
      <h2 id="poseDialogTitle">调整人台</h2>
      <form method="dialog"><button type="submit">关闭</button></form>
    </div>
    <div class="dialogContent">
      <div class="heightEdit">
        <label id="heightInputLabel" for="heightInput">当前身高 cm</label>
        <input id="heightInput" type="number" min="120" max="230" step="0.1" inputmode="decimal">
        <button class="primary" id="applyHeightButton" type="button">应用身高</button>
      </div>
      <p id="poseStatus" aria-live="polite"></p>
      <label class="sliderRow">
        <span>手臂下垂 <b id="angleValue">0</b>°</span>
        <input id="angleSlider" type="range" min="0" max="90" step="1">
      </label>
    </div>
  </dialog>

  <dialog id="referenceDialog" aria-labelledby="referenceDialogTitle">
    <div class="dialogHead">
      <h2 id="referenceDialogTitle">原视频参考</h2>
      <form method="dialog"><button type="submit">关闭</button></form>
    </div>
    <div class="dialogContent">
      <div class="sourceStrip" id="sourceStrip"></div>
    </div>
  </dialog>

  <dialog id="resultsDialog" aria-labelledby="resultsDialogTitle">
    <div class="dialogHead">
      <h2 id="resultsDialogTitle">量体结果</h2>
      <form method="dialog"><button type="submit">关闭</button></form>
    </div>
    <div class="dialogContent">
      <div id="measurementResults" class="resultTable" role="table" aria-label="当前量体表"></div>
      <div class="downloads" id="deliveryDownloads">
        <div class="downloadItem">
          <strong>导出3D人台</strong>
          <a class="button primary" id="downloadModel" href="#" aria-label="导出3D人台">导出</a>
        </div>
        <div class="downloadItem">
          <strong>导出当前量体表</strong>
          <a class="button" id="downloadTable" href="#" aria-label="导出当前量体表">导出</a>
        </div>
      </div>
      <div class="progressActions">
        <button id="saveWorkButton" type="button">保存工作进度</button>
        <button id="openWorkButton" type="button">打开工作进度</button>
      </div>
      <input id="workFileInput" type="file" accept=".bmwork,application/json" hidden>
      <p id="workProgressStatus" aria-live="polite"></p>
    </div>
  </dialog>

  <script id="viewer-payload" type="application/json">__VIEWER_PAYLOAD__</script>
  <script src="./viewer_assets/viewer_runtime.bundle.js"></script>
  <script>
    try {
      window.BodyMeasurementViewer.start();
    } catch (error) {
      window.__bmRuntimeError = error && (error.stack || error.message || String(error));
      document.getElementById('viewer3d').textContent = '三维人台打开失败。';
    }
  </script>
</body>
</html>
