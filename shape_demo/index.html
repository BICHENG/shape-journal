<!doctype html>
<html lang="en" data-type="software">
<head>
<meta charset="utf-8">
<meta name="page-type" content="software">
<meta name="site-kind" content="software">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#141618">
<title>Shape Journal</title>
<style>
:root {
  color-scheme: dark;
  --paper: #141618;
  --floor: #1d2023;
  --line: #3c4145;
  --ink: #eef1f3;
  --muted: #aab1b6;
  --accent: #c2cdd3;
  --selected: #d8c1a7;
  --outline-start: #ff7169;
  --outline-current: #5ed2ff;
  --edge: clamp(22px, 4vw, 68px);
  font-family: "Segoe UI", system-ui, sans-serif;
  color: var(--ink);
  background: var(--paper);
  font-synthesis: none;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
button:disabled { cursor: default; opacity: .42; }
a { color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, .scene:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
::selection { color: var(--paper); background: var(--accent); }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}

.shell {
  min-height: min(100svh, 780px);
  height: 100svh;
  display: grid;
  grid-template-rows: 64px minmax(512px, 1fr) auto;
}
.top {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 24px;
  padding-inline: var(--edge);
  border-bottom: 1px solid var(--line);
  z-index: 1;
}
.identity { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
.brand { font: 600 24px/1 "Bahnschrift", "Segoe UI", sans-serif; letter-spacing: -.025em; }
.mode { color: var(--muted); font-size: 12px; white-space: nowrap; }
.people-link {
  color: var(--accent); font-size: 12px; white-space: nowrap; text-decoration: none;
}
.people-link:hover { text-decoration: underline; text-underline-offset: 4px; }
.part-tabs { display: flex; align-items: stretch; align-self: stretch; gap: clamp(13px, 2.35vw, 34px); }
.part-tabs button, .views button, .reference {
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  min-height: 42px;
}
.part-tabs button {
  min-width: 48px;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
}
.part-tabs button:hover, .views button:hover, .reference:hover { color: var(--ink); }
.part-tabs button[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); }
.file-controls { display: flex; align-items: center; justify-content: end; gap: 14px; }
.file-controls button, .file-controls a {
  display: inline-flex; align-items: center; min-height: 40px; white-space: nowrap;
  padding: 0 13px; border: 1px solid var(--line); border-radius: 7px; font-size: 13px;
  text-decoration: none; background: transparent;
}
.file-controls button:hover, .file-controls a:hover { background: var(--floor); }
.file-controls .primary, .intake .primary { color: var(--paper); background: var(--accent); }
.file-controls .primary:hover, .intake .primary:hover { background: #d7e0e4; }

.studio {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: 62px minmax(0, 1fr) 48px;
  min-height: 0;
  padding-inline: var(--edge);
  background: radial-gradient(ellipse 57% 93% at 50% 44%, #292d31 0, #1d2023 48%, #151719 100%);
}
h1 { margin: 0; font-size: clamp(39px, 3.8vw, 57px); font-weight: 400; line-height: 1.1; letter-spacing: -.038em; }
.viewbar { grid-area: 1 / 1; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.view-context { justify-self: end; min-width: 0; }
.source-tabs {
  display: inline-grid; grid-template-columns: repeat(3, 1fr); width: max-content;
  padding: 3px; border-radius: 9px; background: #1c2023; border: 1px solid var(--line);
}
.source-tabs button {
  min-height: 36px; padding: 0 16px; border: 0; border-radius: 6px;
  color: var(--muted); background: transparent; font-size: 13px; touch-action: manipulation;
  transition: color .15s, background .15s;
}
.source-tabs button:hover, .source-tabs button[aria-pressed="true"] { color: var(--ink); }
.source-tabs button[aria-pressed="true"] { background: #353c42; }
#take-control select, .intake select, .intake input {
  background: var(--floor); border: 1px solid var(--line); padding: 8px; border-radius: 6px;
}
#take-status, #source-status { color: var(--muted); font-size: 11px; }
.world { grid-area: 2 / 1; min-width: 0; min-height: 0; position: relative; }
.measurement-readout {
  position: absolute; top: 11px; left: 2px; z-index: 1;
  display: grid; gap: 3px; pointer-events: none; color: var(--ink);
  text-shadow: 0 1px 4px var(--paper);
}
.measurement-readout .metric { color: var(--muted); font-size: 12px; }
.measurement-values { font: 500 clamp(16px, 2.5vw, 28px)/1.18 "Segoe UI", system-ui, sans-serif; font-variant-numeric: tabular-nums; white-space: nowrap; }
.measurement-values small { font-size: 12px; color: var(--muted); }
#measurement-start { color: var(--outline-start); }
#measurement-current { color: var(--outline-current); }
.contour-legend {
  position: absolute; top: 14px; right: 2px; display: flex; gap: 16px; align-items: center;
  color: var(--ink); font-size: 12px; pointer-events: none;
}
.contour-legend span::before {
  content: ""; display: inline-block; width: 15px; margin-right: 6px; vertical-align: .22em;
  border-top: 2px solid var(--outline-current);
}
.contour-legend span:first-child::before { border-color: var(--outline-start); }
.scene { width: 100%; height: 100%; min-height: 0; cursor: grab; touch-action: none; position: relative; }
.scene:active { cursor: grabbing; }
.scene canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
.scene:focus-visible { outline-offset: -3px; }
.screen-frame { position: absolute; width: 1px; background: #f8efdcdd; pointer-events: none; }
.world:has(.screen-frame:not([hidden])) .scene { cursor: default; touch-action: pan-y; }
.scene-error, .receipt {
  position: absolute; inset: auto 12px 12px; margin: 0;
  padding: 9px 13px; border-radius: 7px; background: var(--paper); color: var(--accent);
}
.observations {
  grid-area: 3 / 1; height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
  padding-bottom: 6px;
}
.views { display: flex; align-items: center; gap: 4px; }
#description { margin-left: 8px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.views button { padding: 0 9px; min-height: 40px; border-radius: 5px; }
.views button[aria-pressed="true"] { color: var(--ink); background: #30363b; }
.reference { min-width: 105px; color: var(--accent); text-align: right; touch-action: none; user-select: none; }
.reference::before { content: ""; display: inline-block; width: 14px; border-top: 2px solid var(--outline-start); margin-right: 8px; vertical-align: middle; }
.reference[aria-pressed="true"] { color: var(--selected); }

.source-dock {
  grid-area: 3 / 1; min-width: 0; max-width: 720px; height: 48px; padding-bottom: 6px;
  display: flex; align-items: center; gap: 11px;
}
.source-player { min-width: 0; display: flex; align-items: center; gap: 11px; flex: 1; }
.source-player .play { flex: none; }
#source-time { min-width: 40px; flex: 1; }
.source-dock label, #source-clock { color: var(--muted); font-size: 12px; white-space: nowrap; }
.source-readout { display: flex; flex-direction: column; text-align: right; }
#source-clock { font-variant-numeric: tabular-nums; }
#take-control select { padding: 5px; }

#pipeline-steps { display: flex; gap: 6px; }
#pipeline-steps button {
  min-height: 36px; padding: 0 13px; border: 1px solid transparent; border-radius: 6px;
  background: transparent; color: var(--muted); white-space: nowrap; font-size: 13px;
}
#pipeline-steps button:hover, #pipeline-steps button[aria-pressed="true"] {
  border-color: #596168; color: var(--ink); background: #2a3035;
}

.shell[data-view="group"] { grid-template-rows: 64px minmax(585px, 1fr); }
.shell[data-view="group"] :is(.studio, .dock, #download) { display: none; }
.group {
  min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr);
  gap: 12px; padding: 27px var(--edge) 25px;
  background: radial-gradient(ellipse 65% 78% at 50% 57%, #292d31 0, #1d2023 56%, #151719 100%);
}
.group-heading { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.group-heading h1 { font-size: clamp(31px, 3.3vw, 48px); }
.group-transport {
  display: grid; grid-template-columns: auto minmax(92px, 190px);
  gap: 12px; align-items: center;
}
.group-transport .play {
  display: flex; align-items: center; gap: 9px; width: auto; min-width: 96px;
  padding: 0 13px; border-radius: 8px; font-size: 13px;
}
#group-time { min-width: 0; width: 100%; }
#group-status { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
#group-status:empty { display:none; }
.group-people { min-height: 0; position: relative; overflow: hidden; isolation: isolate; }
.group-people canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.group-person {
  position: absolute; inset: 0 auto auto 0; display: flex; align-items: end;
  color: var(--ink); text-decoration: none; touch-action: manipulation;
}
.group-person span {
  width: 100%; height: var(--caption); display: grid; place-items: center;
  padding-inline: 2px; white-space: nowrap; font-size: var(--name-size); font-weight: var(--name-weight);
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  opacity: var(--name-alpha); transform: scale(var(--name-depth)); letter-spacing: .028em;
}
a.group-person:hover span {
  color: var(--ink); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--accent);
}
@media (max-width: 820px) {
  .shell[data-view="group"] { grid-template-rows: 62px minmax(700px, 1fr); }
  .shell[data-view="group"] .top { grid-template-rows: 1fr; }
  .group { padding-block: 17px 16px; gap: 9px; }
  .group-heading { gap: 10px; }
  .group-heading h1 { font-size: clamp(24px, 6.6vw, 34px); white-space: nowrap; }
  .group-transport { grid-template-columns: auto minmax(45px, 105px); gap: 8px; }
  .group-transport .play { min-width: 0; min-height: 42px; padding: 0 9px; font-size: 12px; gap: 6px; }
}

.dock {
  padding: 14px var(--edge) 18px;
  border-top: 1px solid var(--line);
}
.rail-panel {
  --timeline-track-height: 25px;
  display: grid; grid-template-columns: 44px minmax(0, 1fr);
  grid-template-rows: 37px var(--timeline-track-height) auto; column-gap: 15px; align-items: center;
}
#time-label { grid-area: 1 / 1; color: var(--muted); font-size: 11px; white-space: nowrap; }
.date-rail { grid-area: 1 / 2; position: relative; align-self: stretch; margin-inline: 6px; }
#timeline-date {
  position: absolute; bottom: 1px;
  left: clamp(var(--date-half, 0px), var(--date-position, 0%), calc(100% - var(--date-half, 0px)));
  transform: translateX(-50%); color: var(--selected);
  font-size: clamp(22px, 2.55vw, 34px); line-height: 1; font-variant-numeric: tabular-nums;
  font-weight: 500; white-space: nowrap;
}
.play {
  display: grid; place-items: center; width: 40px; height: 40px; padding: 0;
  color: var(--accent); background: transparent; border: 1px solid #566269; border-radius: 50%;
}
.play:hover { background: #2b3136; }
.play .icon { width: 0; height: 0; margin-left: 2px; border-block: 5px solid transparent; border-left: 8px solid currentColor; }
.play[data-running="true"] .icon { width: 8px; height: 10px; margin: 0; border-block: none; border-inline: 2px solid currentColor; }
#play { width: 44px; height: 44px; grid-area: 2 / 1 / 4 / 2; }
.range {
  appearance: none; display: block; width: 100%; height: 36px; margin: 0; padding: 0;
  background: transparent; border: 0; border-radius: 2px; cursor: ew-resize; touch-action: none;
}
.range::-webkit-slider-runnable-track {
  height: 2px; border-radius: 2px;
  background: linear-gradient(to right, var(--accent) 0 var(--progress, 0%), #515c64 var(--progress, 0%) 100%);
}
.range::-webkit-slider-thumb {
  appearance: none; width: 13px; height: 13px; margin-top: -5.5px; border-radius: 50%;
  border: 2px solid var(--accent); background: var(--paper);
}
.range::-moz-range-track { height: 2px; background: #515c64; }
.range::-moz-range-progress { height: 2px; background: var(--accent); }
.range::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--accent); background: var(--paper); }
#time { grid-area: 2 / 2; height: var(--timeline-track-height); }
.stops { grid-area: 3 / 2; position: relative; height: 33px; margin: -5px 6px 0; }
.stops button {
  position: absolute; top: 0; height: 33px; min-width: 0; padding: 0;
  border: 0; border-radius: 3px; background: transparent; color: var(--muted);
  font-size: 11px; font-variant-numeric: tabular-nums;
}
.stops button::before, .stops button::after {
  content: ""; position: absolute; left: var(--point); transform: translateX(-50%);
  background: #66737b;
}
.stops button::before { width: 1px; top: 0; height: 8px; }
.stops button::after { width: 5px; height: 5px; top: 7px; border-radius: 50%; }
.stops button:is(:hover, :focus-visible, [aria-current="step"]) { color: var(--ink); }
.stops button[aria-current="step"]::after { width: 8px; height: 8px; top: 5.5px; background: var(--selected); }
.stops .date { position: absolute; top: 16px; left: var(--point); transform: translateX(-50%); white-space: nowrap; }
.stops button:first-child .date { transform: none; }
.stops button:last-child:not(:first-child) .date { transform: translateX(-100%); }

.intake { max-width: min(520px, 95vw); padding: 24px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 14px; }
.intake::backdrop { background: #0b0c0dc0; }
.intake form, .intake .field { display: grid; gap: 12px; }
.intake-heading, .form-row, .intake-footer { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
.intake h2, .intake p, .file-list { margin: 0; }
.intake p { color: var(--muted); margin-top: 4px; }
.intake button { min-height: 42px; padding: 0 10px; border: 1px solid var(--line); background: var(--floor); border-radius: 7px; }
.intake .file-picker { width: 100%; display: flex; justify-content: space-between; align-items: center; }
.intake .field { min-width: 0; flex: 1; }
.intake input { width: 100%; min-width: 0; }

@media (max-width: 820px) {
  :root { --edge: 16px; }
  .shell { grid-template-rows: 62px minmax(514px, 1fr) auto; }
  .top { gap: 0 12px; }
  .identity { grid-area: 1 / 1; }
  .file-controls { grid-area: 1 / 2; }
  .brand { font-size: 22px; }
  .identity { gap: 11px; }
  .mode { font-size: 11px; }
  .part-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
  .part-tabs button { min-width: 0; min-height: 35px; font-size: 12px; }
  .file-controls { gap: 8px; }
  .file-controls button, .file-controls a { min-height: 37px; padding: 0 9px; font-size: 12px; }
  .studio {
    grid-template-rows: 92px minmax(255px, 1fr) 48px;
    background: radial-gradient(ellipse 88% 64% at 50% 51%, #2b2f33 0, #202427 53%, #151719 100%);
  }
  .viewbar { grid-template-columns: minmax(0, 1fr); grid-template-rows: 45px 36px; gap: 3px; align-content: center; }
  .view-context { justify-self: stretch; }
  .source-tabs button { min-height: 38px; padding: 0 10px; font-size: 12px; }
  #pipeline-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  #pipeline-steps button { min-height: 35px; padding: 0 6px; font-size: 12px; }
  .observations { gap: 9px; }
  .views button, .reference { font-size: 12px; }
  .views button { padding: 0 8px; }
  .source-dock, .source-player { gap: 7px; }
  .source-dock .play { width: 35px; height: 35px; }
  .dock { padding: 9px var(--edge) 10px; }
  .rail-panel {
    --timeline-track-height: 22px; grid-template-columns: 36px minmax(0, 1fr);
    grid-template-rows: 29px var(--timeline-track-height) auto; column-gap: 10px;
  }
  #play { width: 36px; height: 36px; }
}

@media (max-width: 520px) {
  .top:has(#open-intake:not([hidden]), #people-link:not([hidden])) .identity {
    display: grid; grid-template-columns: repeat(2, max-content); gap: 4px 9px;
  }
  .top:has(#open-intake:not([hidden]), #people-link:not([hidden])) .brand { grid-column: 1 / -1; font-size: 19px; }
  .people-link { font-size: 11px; }
  .file-controls { gap: 5px; }
  .file-controls button, .file-controls a { padding-inline: 7px; }
}

@media (max-width: 350px) {
  :root { --edge: 12px; }
  .top { column-gap: 7px; }
  .file-controls button, .file-controls a { padding-inline: 5px; font-size: 11px; }
  .source-tabs button { padding-inline: 9px; }
  .views button { padding-inline: 6px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}

@media (prefers-reduced-motion: no-preference) {
  .studio { animation: studio-in .65s cubic-bezier(.18,.78,.26,1) both; }
  @keyframes studio-in { from { filter: brightness(.92); } to { filter: brightness(1); } }
}
</style>
</head>
<body>
<main id="shell" class="shell" data-view="shape">
  <header class="top">
    <div class="identity">
      <span class="brand">Shape Journal</span><span id="mode" class="mode">Sample</span>
      <a id="people-link" class="people-link" hidden></a>
    </div>
    <div class="file-controls">
      <a id="archive-link" href="/archive" hidden>My Log</a>
      <button id="open-intake" class="primary" type="button" hidden>Add Video</button>
      <button id="download" type="button" title="Export this record as STL in millimetres">Export</button>
    </div>
  </header>
  <section id="group" class="group" aria-labelledby="group-title" hidden>
    <header class="group-heading">
      <h1 id="group-title">Library</h1>
      <div class="group-transport">
        <button id="group-play" class="play" type="button" disabled>
          <span class="icon" aria-hidden="true"></span><span id="group-action">Loading</span>
        </button>
        <input id="group-time" class="range" type="range" min="0" max="1000" value="0" aria-label="Library playback" disabled>
        <output id="group-status" role="status"></output>
      </div>
    </header>
    <div id="group-people" class="group-people"></div>
  </section>
  <section class="studio" aria-label="Body viewer">
    <div class="viewbar">
      <nav class="source-tabs" aria-label="View">
        <button id="capture-pose" type="button" aria-pressed="false">Video</button>
        <button id="decompose-view" type="button" aria-pressed="false">Breakdown</button>
        <button id="shape-view" type="button" aria-pressed="true">Shape</button>
      </nav>
      <div class="view-context">
        <nav id="parts" class="part-tabs" aria-label="Body region"></nav>
        <nav id="pipeline-steps" aria-label="Breakdown layers" hidden></nav>
      </div>
    </div>
    <section class="world" aria-label="Scene">
      <div id="scene" class="scene" tabindex="0" role="region" aria-label="3D view. Drag or use the left and right arrow keys to rotate."></div>
      <div id="screen-frame" class="screen-frame" role="img" aria-label="Video on the left. Fitted shape on the right." hidden></div>
      <output id="measurement-readout" class="measurement-readout" aria-live="polite" hidden>
        <span id="measurement-name" class="metric"></span>
        <span class="measurement-values"><span id="measurement-start"></span> <small>→</small> <span id="measurement-current"></span> <small>cm</small></span>
      </output>
      <div id="contour-legend" class="contour-legend" aria-label="Outline comparison" hidden><span>Start</span><span>Current</span></div>
      <p id="scene-error" class="scene-error" role="status" hidden></p>
      <p id="take-status" class="receipt" role="status" hidden></p>
      <p id="receipt" class="receipt" role="status" hidden></p>
    </section>
    <section id="observations" class="observations" aria-label="Body comparison">
      <div class="views" role="group" aria-label="Camera angle">
        <button id="framing" type="button">Angle</button>
        <button id="front" type="button" aria-pressed="false">Front</button>
        <button id="side" type="button" aria-pressed="false">Side</button>
        <span id="description" hidden></span>
      </div>
      <button type="button" id="reference" class="reference" aria-pressed="false">Hold for Start</button>
    </section>
    <div id="source-transport" class="source-dock" hidden>
      <div id="source-player" class="source-player">
        <button id="source-play" class="play" type="button" aria-label="Play video"><span class="icon" aria-hidden="true"></span></button>
        <label id="source-label" for="source-time">Video</label>
        <input id="source-time" class="range" type="range" min="0" max="0" value="0" step="1">
        <div class="source-readout">
          <output id="source-clock" for="source-time" aria-live="off"></output>
          <span id="source-status" role="status" hidden></span>
        </div>
      </div>
      <label id="take-control" hidden><span class="sr-only">Clips from this visit</span><select id="take-select"></select></label>
    </div>
  </section>
  <div class="dock">
    <section id="timeline" class="timeline rail-panel" aria-label="Record timeline">
      <label id="time-label" for="time">Visits</label>
      <div class="date-rail"><time id="timeline-date"></time></div>
      <button id="play" class="play" type="button" aria-label="Play timeline"><span class="icon" aria-hidden="true"></span><span id="play-label" class="sr-only">Play</span></button>
      <input id="time" class="range" type="range" min="0" max="1000" value="1000" step="1">
      <nav id="stops" class="stops" aria-label="Visits"></nav>
    </section>
  </div>
</main>
<dialog id="intake" class="intake" aria-labelledby="intake-title">
  <form id="capture-form">
    <div class="intake-heading">
      <div><h2 id="intake-title">Add Video</h2><p>Add clips from one visit together. Keep the head and feet in frame.</p></div>
      <button type="button" id="close-intake" class="close" aria-label="Close upload">Close</button>
    </div>
    <label id="visit-field" class="field" hidden>Save to

      <label class="field">Date<input id="capture-date" name="date" type="date" required></label>

      <ul id="file-list" class="file-list" aria-label="Selected clips"></ul>
    </div>
    <progress id="capture-progress" hidden></progress>
    <div class="intake-footer">
      <span id="capture-status" role="status"></span>
      <button id="send-capture" class="primary" type="submit" disabled>Save Visit</button>
    </div>
  </form>
</dialog>
